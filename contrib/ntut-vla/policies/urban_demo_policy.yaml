# Urban demo policy — AirSimNH (neighborhood) world.
# Altitude band 15-25 m: above the houses (~9 m) and trees (~15 m); physical
# obstacle avoidance below that is the flight-stack team's layer, not ours.
# The NFZ square sits over a residential block on the diagonal route.
policy_id: fase3-urban-demo
version: 0.1.0

constraints:
  - id: nfz-residential-block
    type: polygon_fence
    constraint_type: hard
    priority: P0
    violation_action: repair
    vertices:
      - { x: 7,  y: 7 }
      - { x: 23, y: 7 }
      - { x: 23, y: 23 }
      - { x: 7,  y: 23 }
    altitude_floor_m: 0
    altitude_ceiling_m: 100
    margin_m: 1.0

  - id: alt-band-urban
    type: altitude_envelope
    constraint_type: hard
    priority: P0
    violation_action: repair
    alt_min_m: 15
    alt_max_m: 25

  - id: kin-caps
    type: kinematic_envelope
    constraint_type: hard
    priority: P1
    violation_action: repair
    speed_max_mps: 4.0
    climb_rate_max_mps: 2.0
    yaw_rate_max_dps: 45.0
